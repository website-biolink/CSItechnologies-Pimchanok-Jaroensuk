<style>
:root{--gold:#9D8A60;--gold-dark:#8B7A54;--ink:#111;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:24px 20px 60px}
.share{position:absolute;top:22px;left:20px;width:38px;height:38px;border-radius:50%;background:var(--gold);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.share:focus-visible{outline:3px solid #000;outline-offset:2px}
.card{width:100%;max-width:420px;margin-top:104px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #fff,0 6px 24px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:72px;height:auto;display:block}
h1{font-size:20px;font-weight:700;margin-top:24px;letter-spacing:-.01em}
.role{font-size:17px;margin-top:10px;color:#1a1a1a}
.links{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:14px}
.btn{display:block;width:100%;padding:16px 20px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-size:18px;text-align:center;transition:background .15s,transform .15s}
.btn:hover{background:var(--gold-dark)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid #000;outline-offset:3px}
.contact{margin-top:50px;display:flex;gap:26px;align-items:center;justify-content:center}
.contact a{color:var(--ink);display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%}
.contact a:hover{background:#f3efe6}
.contact a:focus-visible{outline:3px solid #000;outline-offset:2px}
.contact svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
